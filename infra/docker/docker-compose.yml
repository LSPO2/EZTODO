version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: eztodo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eztodo
      POSTGRES_USER: eztodo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eztodo_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eztodo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Application
  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    container_name: eztodo-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=eztodo
      - POSTGRES_USER=eztodo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-eztodo_dev_password}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your_jwt_secret_change_in_production}
      - AI_API_KEY=${AI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Caddy Reverse Proxy
  caddy:
    image: caddy:2-alpine
    container_name: eztodo-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
